name: emergency-response-env

description: >
  An AI environment simulating emergency response coordination during cascading incidents.

tasks:
  - name: easy_allocation
    description: Single incident allocation
    grader: tasks.graders.grade_allocation

  - name: medium_multi_incident
    description: Multiple simultaneous incidents
    grader: tasks.graders.grade_allocation

  - name: hard_cascade
    description: Cascading emergency handling
    grader: tasks.graders.grade_allocation

entry_point: env.environment:EmergencyEnv

observation_space:
  type: list

action_space:
  type: list

reward:
  description: continuous score strictly between 0 and 1
